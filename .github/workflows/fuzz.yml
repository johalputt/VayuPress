name: Fuzz — Critical Path Safety
on:
  schedule:
    - cron: '0 2 * * 0'  # weekly Sunday 02:00 UTC
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: 'Fuzz duration per target (e.g. 30s, 2m)'
        default: '30s'
permissions:
  contents: read
jobs:
  fuzz:
    name: "Fuzz critical parsers"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install C build tools
        run: sudo apt-get install -y gcc build-essential
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true
      - name: Fuzz migrations parser
        env:
          # Interpolating the input straight into run: would let whoever
          # dispatches the workflow inject shell (audit). Env indirection keeps
          # it data, never code.
          FUZZ_TIME: ${{ github.event.inputs.fuzz_time || '30s' }}
        run: |
          go test -fuzz=FuzzMigratorApply -fuzztime="$FUZZ_TIME" ./internal/migrations/
      - name: Fuzz event schema validator
        env:
          FUZZ_TIME: ${{ github.event.inputs.fuzz_time || '30s' }}
        run: |
          go test -fuzz=FuzzValidate -fuzztime="$FUZZ_TIME" ./internal/events/schema/
