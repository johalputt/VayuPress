name: Dependency Freshness

# The "show red so I know" half of the dependency-freshness system: a scheduled,
# read-only check that goes RED when a DIRECT third-party dependency is behind
# its latest release, with a job-summary table of exactly what needs updating.
# The auto-update half is Dependabot (.github/dependabot.yml), which opens the
# actual bump PRs. Runs weekly and on demand — not on every push — so it flags
# drift without blocking normal development.

on:
  schedule:
    # Mondays 14:17 UTC — deliberately EIGHT HOURS after Dependabot's own weekly
    # run at 06:00 (.github/dependabot.yml), not seventeen minutes after it.
    #
    # The two halves were scheduled to race. Dependabot opens the bump PRs at
    # 06:00, CI gates them, and auto-merge lands them minutes later; this check
    # fired at 06:17, in the middle of that, and reported as unattended drift
    # the very updates that were being applied while it looked. A check that
    # goes red every week for something already in flight is one people stop
    # reading, and then it is red for a real reason and nobody notices.
    - cron: "17 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: dep-freshness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: "Go module freshness (red = a direct dep is behind)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "stable"
          cache: true
      - name: Report outdated Go modules
        run: |
          chmod +x scripts/dep-freshness.sh
          scripts/dep-freshness.sh
