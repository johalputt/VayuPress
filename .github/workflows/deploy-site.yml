name: deploy-site

# Publishes the marketing/docs site (docs/site/) to GitHub Pages using the
# official first-class Pages deployment (upload-pages-artifact + deploy-pages),
# deploying straight to the `github-pages` environment. This replaces the older
# gh-pages branch-push: that method's auto "pages build and deployment" deploy
# stage was being rejected by the environment's branch-protection rule (only the
# build stage passed → the red "2/3" on the bot commit), even though the site
# kept serving. The Actions deploy runs as one clean, green job.
#
# ONE-TIME SETTING REQUIRED: Settings → Pages → Build and deployment → Source =
# "GitHub Actions" (instead of "Deploy from a branch"). The custom domain
# (vayupress.com) is carried through docs/site/CNAME in the uploaded artifact,
# so it keeps working; leave it set under Settings → Pages → Custom domain.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "static/css/docs.css"
      - "cmd/vayudocs/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
  # Daily refresh so the live GitHub-star count on the site stays current even
  # when no site files changed (the star count is baked into assets/stars.json
  # at deploy time — see "Bake live GitHub star count" below).
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; do not cancel an in-progress production
# deploy (GitHub Pages best practice).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Assemble site payload
        run: |
          set -euo pipefail
          SRC="docs/site"
          if [ ! -f "$SRC/index.html" ]; then
            echo "::error::$SRC/index.html not found — nothing to deploy"
            exit 1
          fi
          rm -rf _site
          mkdir -p _site
          # Copy the site (includes CNAME so the custom domain is preserved).
          cp -r "$SRC"/. _site/
          # README.md is source-only; it should not ship to the live site.
          rm -f _site/README.md
          # Disable Jekyll processing (serve files verbatim).
          touch _site/.nojekyll
          # Bundle the screenshots referenced by the site.
          mkdir -p _site/screenshots
          if [ -d docs/screenshots ]; then
            cp docs/screenshots/*.png _site/screenshots/ 2>/dev/null || true
          fi
          echo "Assembled _site:"
          ls -la _site

      - name: Render documentation into /docs
        # Render the guides, security model, operations runbooks and every ADR to
        # static HTML at /docs, so vayupress.com/docs serves the same docs the
        # running binary serves at <site>/docs. cmd/vayudocs is cgo-free (no
        # SQLite), so this is a seconds-long build, not a full engine build.
        run: |
          set -euo pipefail
          go run ./cmd/vayudocs -src docs -css static/css/docs.css -out _site/docs
          echo "Rendered docs (top level):"
          ls _site/docs | head

      - name: Bake live GitHub star count
        # Fetch the repo's current star count with the workflow token (5,000
        # req/hr, never the anonymous 60/hr limit) and write it to a same-origin
        # assets/stars.json the site reads first — so the count is correct the
        # instant the page loads, even when a visitor's network blocks the
        # GitHub API. The client still refreshes it live in-browser afterwards.
        # Best-effort: a failure leaves the site's built-in fallback intact.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p _site/assets
          COUNT=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}" \
                  | grep -o '"stargazers_count"[[:space:]]*:[[:space:]]*[0-9]*' \
                  | grep -o '[0-9]*$' || true)
          if [ -n "${COUNT:-}" ]; then
            printf '{"stargazers_count":%s,"generated_at":"%s"}\n' \
              "$COUNT" "$(date -u +%FT%TZ)" > _site/assets/stars.json
            echo "Baked star count: $COUNT"
          else
            echo '{"stargazers_count":null}' > _site/assets/stars.json
            echo "::warning::could not fetch star count; site will use its live client fetch"
          fi
          # Same treatment for the latest release tag: bake assets/version.json
          # so the site shows the current version instantly on load, then the
          # client refreshes it live from the releases API.
          TAG=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
                  | grep -o '"tag_name"[[:space:]]*:[[:space:]]*"[^"]*"' \
                  | grep -o '"[^"]*"$' | tr -d '"' || true)
          if [ -n "${TAG:-}" ]; then
            printf '{"tag_name":"%s","generated_at":"%s"}\n' \
              "$TAG" "$(date -u +%FT%TZ)" > _site/assets/version.json
            echo "Baked version: $TAG"
          else
            echo '{"tag_name":null}' > _site/assets/version.json
            echo "::warning::could not fetch latest release; site will use its live client fetch"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
