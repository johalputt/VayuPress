name: e2e

# End-to-end tests (Playwright) for the public site. The server is booted on the
# runner; a tiny header-injecting proxy (scripts/screenshot-proxy) supplies the
# admin X-API-Key so protected pages are reachable. Mirrors the boot sequence of
# screenshots.yml, which is known-good. (Admin v2 was removed in v1.6.0, ADR-0069
# Stage 3; its e2e specs were removed with it.)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_baselines:
        description: "Render the visual baselines on this runner's Chromium and commit them"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ !inputs.update_baselines }}
    runs-on: ubuntu-latest
    env:
      API_KEY: e2e-ci-key
      # The suite drives the console with this one key, several specs at
      # once; an operator's browser uses a session, which the per-key budget
      # never applies to. At the default 600/min the long page walks spent the
      # budget mid-run and every later page was the rate-limit JSON, which
      # Chromium draws as a bare <pre>: the intermittent media-upload,
      # outside-services and design-lint failures.
      VAYU_API_RATE_PER_MIN: "100000"
      DB_PATH: /tmp/vayupress/vayupress.db
      CACHE_DIR: /tmp/vayupress/cache
      MEDIA_DIR: /tmp/vayupress/media
      TMP_DIR: /tmp/vayupress/tmp
      PORT: "8080"
      DOMAIN: localhost
      UPSTREAM: http://localhost:8080
      PROXY_URL: http://localhost:8088
      BASE_URL: http://localhost:8088
      ARTICLE_SLUG: hello-vayupress
      STATIC_DIR: ${{ github.workspace }}/static
      VAYU_DOCS_DIR: ${{ github.workspace }}/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/boot-vayupress

      # A commit that changes a surface's look on purpose says which, in a
      # line of its message: "Baselines: settings, outside-services". Those
      # surfaces are rendered afresh and recorded by the record job below once
      # everything else in this run has passed; every other surface is still
      # compared. Re-recording everything would have absorbed the brand
      # restyle of 780f0255, which only the unnamed surfaces caught.
      - name: Surfaces this commit re-records
        id: rerecord
        shell: bash
        run: |
          names=$(git log -1 --format=%B | sed -n 's/^Baselines:[[:space:]]*//p' | head -1 | tr -d ' ')
          if [ -n "$names" ] && ! [[ "$names" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
            echo "::error::Baselines: takes surface names separated by commas, got '$names'"; exit 1
          fi
          echo "pattern=(${names//,/|}) looks as designed" >> "$GITHUB_OUTPUT"
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Screenshots match the baselines
        working-directory: tests/e2e
        # First, on the install exactly as the boot left it, because that is
        # what the baselines were rendered from (update_baselines runs this
        # spec alone on a fresh boot). The other specs publish posts, upload
        # files and mark the bell read, which would change the picture. Its
        # own output folder keeps the diff images from the next run's clean.
        env:
          NAMES: ${{ steps.rerecord.outputs.names }}
          PATTERN: ${{ steps.rerecord.outputs.pattern }}
        run: |
          if [ -z "$NAMES" ]; then
            npx playwright test visual.spec.js --output test-results-visual
          else
            npx playwright test visual.spec.js --output test-results-visual --grep-invert "$PATTERN"
            # A name that matches no surface is a typo, and Playwright fails
            # on "no tests found": it is never silently skipped.
            npx playwright test visual.spec.js --output test-results-visual-new --grep "$PATTERN" --update-snapshots
          fi

      - name: Keep the re-recorded baselines
        if: ${{ steps.rerecord.outputs.names != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rerecorded-baselines
          path: tests/e2e/visual.spec.js-snapshots/

      - name: Page grammar is no further from its baseline
        if: ${{ !cancelled() }}
        working-directory: tests/e2e
        # Second, alone, on the install as the screenshots left it: that is
        # exactly where update_baselines records anatomy-baseline.json, since
        # what a page counts depends on what the install holds and on what
        # this runner's network lets it reach (the release check, the bot
        # lists), so the counts are only comparable measured the same way.
        run: npx playwright test anatomy.spec.js --output test-results-anatomy

      - name: Run Playwright tests
        if: ${{ !cancelled() }}
        working-directory: tests/e2e
        run: npx playwright test --grep-invert "looks as designed|page grammar"

      # The server's own log travels with the failure. Without it a page that
      # came back wrong could only be guessed at from the browser's side, and
      # the folder this step used to upload (playwright-report/) is never
      # written: the reporters here are github and list.
      - name: Keep the server's log with the results
        if: always()
        run: |
          mkdir -p tests/e2e/test-results
          cp /tmp/vayupress/server.log /tmp/vayupress/proxy.log tests/e2e/test-results/ 2>/dev/null || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            tests/e2e/test-results/
            tests/e2e/test-results-visual/
            tests/e2e/test-results-anatomy/
          if-no-files-found: ignore

      - name: Stop background processes
        if: always()
        run: |
          [ -f /tmp/vayupress/proxy.pid ]  && kill "$(cat /tmp/vayupress/proxy.pid)"  || true
          [ -f /tmp/vayupress/server.pid ] && kill "$(cat /tmp/vayupress/server.pid)" || true

    outputs:
      names: ${{ steps.rerecord.outputs.names }}

  # Commits the surfaces a pushed commit named in "Baselines:", and only once
  # the whole e2e job passed on it, so a re-recorded picture never lands beside
  # a failing test. The only job here that can write to the repository.
  record:
    needs: e2e
    if: ${{ github.event_name == 'push' && needs.e2e.outputs.names != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.SCREENSHOTS_PAT || github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rerecorded-baselines
          path: tests/e2e/visual.spec.js-snapshots/
      - name: Commit them
        env:
          NAMES: ${{ needs.e2e.outputs.names }}
        run: |
          git config user.name  "johalputt"
          git config user.email "ankushchoudharyjohal@gmail.com"
          git add tests/e2e/visual.spec.js-snapshots
          if git diff --cached --quiet; then
            echo "The named surfaces already match their baselines."; exit 0
          fi
          git commit -m "e2e: re-recorded baselines for ${NAMES//,/, }"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

  # Visual baselines (tests/e2e/visual.spec.js) are rendered by THIS runner's
  # Chromium: a baseline from any other browser build differs on anti-aliasing
  # alone. Run on demand after a deliberate design change, review the diff of
  # the committed images, and the e2e job compares against them from then on.
  baselines:
    if: ${{ inputs.update_baselines }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      API_KEY: e2e-ci-key
      # The suite drives the console with this one key, several specs at
      # once; an operator's browser uses a session, which the per-key budget
      # never applies to. At the default 600/min the long page walks spent the
      # budget mid-run and every later page was the rate-limit JSON, which
      # Chromium draws as a bare <pre>: the intermittent media-upload,
      # outside-services and design-lint failures.
      VAYU_API_RATE_PER_MIN: "100000"
      DB_PATH: /tmp/vayupress/vayupress.db
      CACHE_DIR: /tmp/vayupress/cache
      MEDIA_DIR: /tmp/vayupress/media
      TMP_DIR: /tmp/vayupress/tmp
      PORT: "8080"
      DOMAIN: localhost
      BASE_URL: http://localhost:8088
      STATIC_DIR: ${{ github.workspace }}/static
      VAYU_DOCS_DIR: ${{ github.workspace }}/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ secrets.SCREENSHOTS_PAT || github.token }}

      - uses: ./.github/actions/boot-vayupress

      - name: Render the baselines
        working-directory: tests/e2e
        run: npx playwright test visual.spec.js --update-snapshots

      - name: Record the page grammar counts
        working-directory: tests/e2e
        run: ANATOMY_UPDATE=1 npx playwright test anatomy.spec.js

      - name: Commit the baselines
        run: |
          git config user.name  "johalputt"
          git config user.email "ankushchoudharyjohal@gmail.com"
          git add tests/e2e/visual.spec.js-snapshots tests/e2e/anatomy-baseline.json
          if git diff --cached --quiet; then
            echo "The baselines already match."; exit 0
          fi
          git commit -m "e2e: visual baselines and page grammar counts from CI's Chromium"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1

      - name: Stop background processes
        if: always()
        run: |
          [ -f /tmp/vayupress/proxy.pid ]  && kill "$(cat /tmp/vayupress/proxy.pid)"  || true
          [ -f /tmp/vayupress/server.pid ] && kill "$(cat /tmp/vayupress/server.pid)" || true
