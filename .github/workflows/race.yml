name: Race & Deadlock Detection
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  race:
    name: "go test -race (data race + deadlock)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install C build tools
        run: sudo apt-get install -y gcc build-essential
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 'stable'
          cache: true
      - name: Run tests with race detector
        # -timeout is PER PACKAGE BINARY, and 120s was set when the suite was
        # small enough for that to be generous. It is not any more: race
        # instrumentation costs this suite roughly 5x, and the two heaviest
        # packages were measured at 110s and 148s against that cap. The job did
        # not start failing because something regressed — it started failing
        # because a knob nobody had revisited finally bound. 600s restores the
        # headroom the number was meant to carry; a genuine deadlock still trips
        # it, which is the only thing the timeout is here to catch.
        run: |
          go test -race -timeout=600s -count=1 ./...
          echo "✅ no data races detected"
