# VayuPress — Nginx reverse proxy config for johal.in
# Place at /etc/nginx/sites-available/johal.in
# Symlink: ln -s /etc/nginx/sites-available/johal.in /etc/nginx/sites-enabled/johal.in
# Apply:   sudo nginx -t && sudo systemctl reload nginx

# ── Backend upstream (restart-resilient) ─────────────────────────────────────
# The SAME backend is listed twice so nginx can retry an in-flight idempotent
# request on the second "peer" during a brief (sub-second) restart instead of
# surfacing a 502. max_fails=0 means a peer is never marked permanently down.
# keepalive reuses upstream connections to cut latency. POSTs are NOT retried
# (nginx never retries non-idempotent methods), so this can't double-write.
upstream vayupress_app {
    server 127.0.0.1:8080 max_fails=0;
    server 127.0.0.1:8080 max_fails=0;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name johal.in www.johal.in;

    # ACME challenge — served from filesystem, not proxied to VayuPress
    location ^~ /.well-known/acme-challenge/ {
        root /var/cache/vayupress;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS main server ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # nginx 1.25.1+ deprecates the "http2" listen parameter in favour of a
    # separate `http2 on;` directive. The old form is kept here because it works
    # on every version, where `http2 on;` is a hard "unknown directive" error on
    # anything older — and Debian 12 and Ubuntu 24.04 both still ship older. On
    # 1.25.1+ you may swap the two listen lines for plain `listen 443 ssl;` plus
    # `http2 on;` to silence the deprecation warning.

    # ── HTTP/3 (QUIC) — OPTIONAL, uncomment when supported ───────────────────
    # Requires nginx >= 1.25 built --with-http_v3_module (check: nginx -V).
    # HTTP/3 runs over UDP, so open UDP/443 in the firewall as well as TCP/443
    # or clients silently fall back to HTTP/2 and you gain nothing.
    #
    # This is the piece a CDN was providing for free. On a lossy mobile link
    # QUIC recovers from packet loss without stalling every other stream on the
    # connection, which is exactly where TCP head-of-line blocking hurts most.
    #
    #   listen 443 quic reuseport;
    #   listen [::]:443 quic reuseport;
    #   add_header Alt-Svc 'h3=":443"; ma=86400' always;
    #
    # "reuseport" may appear only ONCE per address:port in the whole config. If
    # you serve several vhosts on 443, put it on the first server block only —
    # a second one is a startup error, not a warning.

    server_name johal.in www.johal.in;

    # TLS — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/johal.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/johal.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    # OCSP stapling is deliberately NOT enabled. Let's Encrypt has retired its
    # OCSP responders, so their certificates no longer carry a responder URL and
    # nginx logs `"ssl_stapling" ignored, no OCSP responder URL in the
    # certificate` on every config test. Stapling nothing is not a security
    # loss; the warning just trains operators to ignore nginx warnings, which is.

    # ── Security headers ─────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Note: CSP is set per-request by VayuPress with a nonce — do not set it here

    # ── Performance ───────────────────────────────────────────────────────────
    # gzip is the floor: every client understands it and it needs no module.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    # Below roughly one MTU, compression costs a round of CPU and can make the
    # response larger. 256 bytes is the usual floor.
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json application/xml+rss
               application/manifest+json application/rss+xml
               image/svg+xml application/atom+xml;

    # ── Brotli — OPTIONAL, uncomment once the module is installed ────────────
    # Requires ngx_brotli. On Debian/Ubuntu:
    #     sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
    # then confirm the modules load (`nginx -V 2>&1 | grep -o brotli`) before
    # uncommenting — an unknown directive fails `nginx -t` and a failed test
    # means the next reload does not happen.
    #
    # This is the other thing a CDN was doing for you. Brotli beats gzip by
    # roughly 15-20% on HTML, CSS and JS, and a browser that does not advertise
    # `br` simply gets the gzip response instead, so there is no compatibility
    # cost. Level 5 is the usual on-the-fly sweet spot; the highest levels cost
    # far more CPU per request than they save in bytes.
    #
    #   brotli            on;
    #   brotli_comp_level 5;
    #   brotli_min_length 256;
    #   brotli_static     on;
    #   brotli_types text/plain text/css text/xml text/javascript
    #                application/javascript application/json application/xml+rss
    #                application/manifest+json application/rss+xml
    #                image/svg+xml application/atom+xml;
    #
    # `brotli_static on` serves a precompressed .br file when one sits beside the
    # original, at zero CPU. VayuPress serves its static assets from the binary,
    # so this only applies to anything you place on disk yourself.

    client_max_body_size 50M;
    proxy_read_timeout   60s;
    proxy_send_timeout   30s;
    proxy_connect_timeout 10s;

    # ── Behind a CDN? Make nginx resolve the visitor ─────────────────────────
    # REQUIRED if a CDN proxies this site. Without it every request appears to
    # come from a handful of edge addresses, so per-IP rate limiting, the
    # reputation jail and auto-block treat your whole audience as a few extremely
    # busy clients — the limit trips and everyone is throttled.
    #
    # VayuPress deliberately will NOT read CF-Connecting-IP through a local proxy.
    # It cannot tell a header the edge set from one a visitor typed, because nginx
    # forwards unknown request headers untouched — so trusting it there let any
    # client choose its own identity and evade every per-IP control. nginx CAN
    # tell the difference, because it sees the real TCP peer. So nginx resolves
    # the visitor and hands it over in X-Real-IP, which proxy_set_header
    # overwrites and a client therefore cannot influence.
    #
    # Generate the range list (re-run when your CDN publishes new ranges):
    #   { for ip in $(curl -s https://www.cloudflare.com/ips-v4) \
    #                $(curl -s https://www.cloudflare.com/ips-v6); do
    #       echo "set_real_ip_from $ip;"; done
    #     echo "real_ip_header CF-Connecting-IP;"
    #     echo "real_ip_recursive on;"
    #   } | sudo tee /etc/nginx/conf.d/00-cdn-realip.conf
    #   sudo nginx -t && sudo systemctl reload nginx
    #
    # Use your own provider's ranges and header for a different CDN. Do NOT add
    # ranges you are not actually behind: any address listed here is permitted to
    # declare the visitor's address.

    # ── ACME challenge (renewals) ────────────────────────────────────────────
    location ^~ /.well-known/acme-challenge/ {
        root /var/cache/vayupress;
        default_type text/plain;
        try_files $uri =404;
    }

    # ── WebSocket (VayuOS live monitoring) ───────────────────────────────────
    location /os/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # ── Health check ─────────────────────────────────────────────────────────
    location /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        access_log off;
    }

    # ── Everything else → VayuPress ──────────────────────────────────────────
    location / {
        proxy_pass http://vayupress_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_header X-CSRF-Token;

        # Restart resilience: retry an idempotent request on the second upstream
        # peer if the first connection fails/times out during a deploy. Bounded
        # so a genuinely-down backend still fails fast.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 8s;
    }

    access_log /var/log/nginx/vayupress-access.log;
    error_log  /var/log/nginx/vayupress-error.log warn;
}
