# nginx-vayushield.conf — Tier 3 (edge) DDoS shaping for VayuPress.
#
# This shapes L7 traffic at the reverse proxy, in front of the Go process:
# per-IP request and connection rate limits, plus the timeouts and buffer caps
# that defeat slow-loris / slow-body attacks. It is the sovereign, self-hosted
# alternative to a third-party scrubber for the traffic a small/medium publisher
# actually faces. It does NOT stop a true volumetric flood that saturates your
# uplink — that requires anycast/scrubbing capacity no single host can provide
# (see the panel note). Pair it with deploy/vayushield-firewall.sh (kernel) and
# VayuShield's in-binary Tier-1 defenses.
#
# Install: put the two zone directives in the http{} block, and the location
# directives inside your VayuPress server{} block, then `nginx -t && systemctl
# reload nginx`. Tune the rates to your real traffic before enabling.

# ── Put these in the http{} context (once, globally) ─────────────────────────
# Shared memory zones keyed by the real client IP.
#   $binary_remote_addr is the client IP; use a map to honour a trusted CDN
#   header if you have one in front of nginx.
limit_req_zone  $binary_remote_addr zone=vp_req:16m  rate=8r/s;    # sustained requests/sec/IP
limit_conn_zone $binary_remote_addr zone=vp_conn:16m;              # concurrent connections/IP

# Slow-loris / slow-body defense: refuse clients that dribble their request.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          15s;
large_client_header_buffers 4 8k;
client_max_body_size  25m;   # raise only if you accept large media uploads

# ── Put these inside the VayuPress server{} block ────────────────────────────
# Apply per-IP shaping to dynamic content, with a burst so a normal reader
# clicking around is never throttled (nodelay serves the burst immediately).
#
#   location / {
#       limit_req  zone=vp_req  burst=20 nodelay;
#       limit_conn vp_conn      32;
#       limit_req_status  429;
#       limit_conn_status 429;
#       proxy_pass http://127.0.0.1:8080;   # your VayuPress upstream
#       proxy_set_header Host              $host;
#       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#       proxy_set_header X-Forwarded-Proto $scheme;
#       proxy_set_header X-Real-IP         $remote_addr;   # VayuShield keys on this
#   }
#
# Static assets can use a looser limit (or none):
#   location /static/ {
#       limit_req zone=vp_req burst=100 nodelay;
#       proxy_pass http://127.0.0.1:8080;
#   }
#
# Return a small, cacheable error page for throttled clients so a 429 is cheap:
#   error_page 429 =429 /__throttled.html;
