# nginx-vayushield.conf — Tier 3 (edge) DDoS shaping for VayuPress.
#
# This shapes L7 traffic at the reverse proxy, in front of the Go process:
# per-IP request and connection rate limits, plus the timeouts and buffer caps
# that defeat slow-loris / slow-body attacks. It is the sovereign, self-hosted
# alternative to a third-party scrubber for the traffic a small/medium publisher
# actually faces. It does NOT stop a true volumetric flood that saturates your
# uplink — that requires anycast/scrubbing capacity no single host can provide
# (see the panel note). Pair it with deploy/vayushield-firewall.sh (kernel) and
# VayuShield's in-binary Tier-1 defenses.
#
# Install: drop this whole file into /etc/nginx/conf.d/ and reload —
#   sudo cp deploy/nginx-vayushield.conf /etc/nginx/conf.d/vayushield.conf
#   sudo nginx -t && sudo systemctl reload nginx
# or let the Tier 3 toggle in VayuOS do it. Nothing needs editing into a vhost.
# Tune the rates to your real traffic before enabling.

# EVERYTHING IN THIS FILE IS ACTIVE. That was not always true, and the way it
# failed is worth knowing: the zones below were declared here while every
# limit_req / limit_conn that USES them sat in a commented example block. nginx
# accepts unused zones without complaint, `nginx -t` passed, the reconcile agent
# wrote "tier3 active", and the panel rendered "● Active" beside copy promising
# per-IP request and connection shaping. 32 MiB of shared memory was allocated
# for rules that did not exist, and nothing anywhere reported a problem.
#
# The enforcement now lives in this same file, in the http{} context, because
# limit_req, limit_conn, limit_req_status and limit_conn_status are all valid
# there and inherit into every server and location. /etc/nginx/conf.d/ IS http
# context, so the file the agent already installs is sufficient — no vhost
# patching, no new agent capability, and nothing that requires the agent to edit
# a file an operator wrote.

# ── Two populations, metered separately ──────────────────────────────────────
#
# $binary_remote_addr is whatever nginx believes the client to be. Behind a CDN
# that is an edge node unless the realip module is configured — see the
# set_real_ip_from block in deploy/nginx-vayupress.conf. Without it these limits
# meter your proxy, not your visitors, and trip for everyone at once.
#
# Browsers and SOFTWARE get different budgets, because they are different
# traffic. A reader opens a page and its assets; an MCP client issues a burst of
# tool calls and an API consumer paginates. Metering both against a limit sized
# for the first refuses the second while it is behaving perfectly normally.
#
# This closes an inconsistency between the tiers rather than inventing a policy.
# Tier 1 already refuses to challenge /mcp, /api and /oauth (shieldBypassPrefixes),
# for the stated reason that their callers cannot solve a browser check and carry
# their own API-key authentication and per-key rate budget. Tier 3 knew none of
# that and metered them like a browser, so nginx could 429 a caller Tier 1 had
# deliberately waved through — which presents to an operator as "the connector is
# broken", with nothing in the app's logs to explain it.
#
# The routing is done with map rather than location blocks. /etc/nginx/conf.d/ is
# http context and `location` is NOT valid there: a location here fails
# `nginx -t` outright, which rolls back the entire Tier 3 install. An empty key
# means "do not account this request", so each request lands in exactly one zone.
map $uri $vp_browser_key {
    default                    $binary_remote_addr;
    "~^/(mcp|api|oauth)(/|$)"  "";
}
map $uri $vp_machine_key {
    default                    "";
    "~^/(mcp|api|oauth)(/|$)"  $binary_remote_addr;
}

limit_req_zone  $vp_browser_key zone=vp_req:16m  rate=8r/s;   # sustained req/s/IP, readers
limit_conn_zone $vp_browser_key zone=vp_conn:16m;             # concurrent connections/IP
# LOOSER, NOT OPEN, and in its OWN zone — so a flood against the machine
# endpoints cannot consume the budget public pages depend on, or the reverse. The
# floor underneath is unchanged: /mcp and /api require a valid API key and
# enforce the per-key budget, which is the control that actually belongs to these
# endpoints. This layer exists so a legitimate burst is not refused before that
# control is ever consulted.
limit_req_zone  $vp_machine_key zone=vp_mach:8m  rate=40r/s;
limit_conn_zone $vp_machine_key zone=vp_mconn:8m;

# ── Enforcement ──────────────────────────────────────────────────────────────
# burst absorbs a normal reader opening a page and its assets at once; nodelay
# serves that burst immediately rather than queuing it, so a real visitor never
# feels the limiter. Only sustained excess is refused.
#
# All four apply to every request; each accounts only the requests whose key is
# non-empty, so a page hits the browser pair and a tool call hits the machine
# pair, never both.
limit_req  zone=vp_req  burst=20  nodelay;
limit_conn vp_conn      32;
limit_req  zone=vp_mach burst=120 nodelay;
limit_conn vp_mconn     64;
# 429 rather than the default 503: a rate limit is about this client, and a
# crawler reads 503 as "the site is down" while 429 is "you, specifically, are
# going too fast". Both carry Retry-After, which is what keeps shedding from
# turning into de-indexing.
limit_req_status  429;
limit_conn_status 429;

# Slow-loris / slow-body defense: refuse clients that dribble their request.
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          15s;
large_client_header_buffers 4 8k;
client_max_body_size  25m;   # raise only if you accept large media uploads

# ── Per-location overrides (optional) ────────────────────────────────────────
# The limits above apply everywhere. To loosen one path rather than tighten it,
# re-declare inside that location — a location-level limit_req REPLACES the
# inherited one, it does not add to it:
#
#   location /static/ { limit_req zone=vp_req burst=100 nodelay; }
#
# Do not add an `include` into your server block for this file; conf.d is
# already http context and including it twice redeclares the zones, which is a
# hard nginx -t failure and rolls back the whole Tier 3 install.
